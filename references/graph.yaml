# Principle co-application graph for pick-relevant-ideas
# Authored cold-start graph: co-application, complements, requires, tensions.
# schema: edges are [a, b, type, weight]
#   co-applies | tension  → symmetric
#   complements | requires → directed a → b
# weight: strong | med  (no authored weak at cold start)

schema_version: 1

semantics:
  co-applies: symmetric
  tension: symmetric
  complements: directed-a-to-b
  requires: directed-a-to-b

retrieval:
  max_hops: 2
  max_binds: 7
  first_hop_weights: [strong, med]
  second_hop_weights: [strong]
  second_hop_require_facet_match: true
  tension_behavior: flag-only
  requires_behavior: same-bind-or-select-prerequisite
  degree_penalty: inverse-sqrt
  # Clusters are labels/eval fixtures, not hyperedges. Never auto-add a cluster.

